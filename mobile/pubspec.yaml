name: cashback_app
description: Cashback mobile app
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.0

  # HTTP client
  dio: ^5.4.3

  # Secure token storage
  flutter_secure_storage: ^9.0.0

  # Barcode scanning
  mobile_scanner: ^5.1.1

  # Image picker (receipt camera)
  image_picker: ^1.1.2

  # Crypto (image hash for duplicate detection)
  crypto: ^3.0.3

  # Device fingerprinting (for fraud detection)
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0

  # UI helpers
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  intl: ^0.19.0

  # URL launcher (email, phone, WhatsApp links)
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.9

flutter:
  uses-material-design: true
  assets:
    - assets/images/
